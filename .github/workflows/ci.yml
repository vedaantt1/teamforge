name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Load test (seed 10k users / 2k teams, p95 gate)
        run: |
          node scripts/seed.js /tmp/ci.db
          DB_PATH=/tmp/ci.db RATE_LIMIT=off PORT=3000 node src/server.js & sleep 2
          node scripts/load.js && grep -q "PASS" LOAD_REPORT.md
      - uses: actions/upload-artifact@v4
        with: { name: load-report, path: LOAD_REPORT.md }
